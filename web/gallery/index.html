<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Photo Gallery</p>
        <h1>Nature & Portraits</h1>
        <p class="hero-copy">A clean, responsive gallery with hover captions and a full-screen lightbox.</p>
      </div>
    </header>

    <section class="gallery-section">
      <div class="gallery-controls">
        <p class="gallery-info">14 photos · responsive layout · lazy loading</p>
      </div>
      <div id="gallery" class="gallery-grid" aria-label="Photo gallery"></div>
    </section>
  </main>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button id="closeButton" class="lightbox-close" aria-label="Close gallery">×</button>
    <button id="prevButton" class="lightbox-nav" aria-label="Previous photo">‹</button>
    <div class="lightbox-content">
      <img id="lightboxImage" alt="Expanded gallery photo" />
      <p id="lightboxCaption" class="lightbox-caption"></p>
    </div>
    <button id="nextButton" class="lightbox-nav" aria-label="Next photo">›</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
